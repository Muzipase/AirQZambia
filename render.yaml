services:
  - type: web
    name: air-quality-hybrid-framework
    runtime: python
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true

  - type: web
    name: airqzambia-dashboard
    runtime: python
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements-dashboard.txt
    startCommand: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: API_BASE_URL
        value: https://air-quality-hybrid-framework.onrender.com