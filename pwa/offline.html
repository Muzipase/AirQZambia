<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12161f" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <title>Offline — AirQ Zambia</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(170deg, #f7f8fa 0%, #eef1f4 100%);
      color: #111827; -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center; max-width: 420px; width: calc(100% - 2rem); padding: 2.4rem 2rem;
      background: #ffffff; border: 1px solid rgba(15, 23, 42, 0.07); border-radius: 18px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 1.1rem; border-radius: 16px;
      display: grid; place-items: center; color: #ffffff;
      background: linear-gradient(135deg, #006a3d 0%, #0a8a4e 100%);
      box-shadow: 0 8px 20px rgba(0, 106, 61, 0.32);
    }
    .status {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      color: #b45309; background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 999px; padding: 0.26rem 0.8rem; margin-bottom: 0.9rem;
    }
    .status .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #f59e0b;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
      70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    h1 { margin: 0; font-size: 1.35rem; letter-spacing: -0.02em; }
    p { color: #4b5563; line-height: 1.65; font-size: 0.92rem; margin: 0.65rem 0 1.4rem; }
    button {
      border: 1.5px solid #006a3d; background: #006a3d; color: #ffffff;
      padding: 0.6rem 1.6rem; border-radius: 999px;
      font: 600 0.9rem "Inter", "Segoe UI", sans-serif; cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0, 106, 61, 0.3); }
    .meta { margin-top: 1.25rem; color: #8a94a6; font-size: 0.72rem; line-height: 1.7; }
    .accent { height: 3px; width: 160px; margin: 0 auto; border-radius: 999px;
      background: linear-gradient(90deg, var(--g, #006a3d) 0%, #006a3d 72%, #ef4444 72%, #ef4444 80%, #131a2b 80%, #131a2b 85%, #f97316 85%, #f97316 100%); }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/>
        <path d="M2 21c0-3 1.9-5.4 5.1-6"/>
      </svg>
    </div>
    <div class="status"><span class="dot"></span> Offline</div>
    <h1>You&rsquo;re offline</h1>
    <p>AirQ Zambia needs a connection for live monitoring. Check your network and try
       again &mdash; the installed app will reconnect automatically once you&rsquo;re back.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="accent" style="--g:#006a3d"></div>
    <div class="meta">AirQ Zambia · National Air Quality Intelligence Platform</div>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
